[project]
name = "ringobot"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "aiohappyeyeballs>=2.7.1",
    "aiohttp>=3.14.5",
    "aiosignal>=1.4.0",
    "attrs>=26.1.0",
    "audioop-lts>=0.2.2",
    "cffi>=2.1.1",
    "davey>=0.1.7",
    "et-xmlfile>=2.0.0",
    "frozenlist>=1.8.0",
    "idna>=3.20",
    "multidict>=7.2.1",
    "openpyxl>=3.1.5",
    "py-cord>=2.8.1",
    "pycparser>=3.12",
    "pynacl>=1.6.2",
    "python-dotenv>=1.2.4",
    "yarl>=1.25.1",
    "yt-dlp>=2026.10.26",
]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
# Cada módulo captura Exception a propósito: un fallo de módulo no debe
# tumbar el bot (ver CLAUDE.md, "Debugging & Logging").
ignore = ["BLE001"]
